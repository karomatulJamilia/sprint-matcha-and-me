name: Send GitHub Project Update to Discord

on:
  issues:
    types: [opened, edited, closed, reopened, milestoned]
  issue_comment:
    types: [created]

jobs:
  notify_discord:
    runs-on: ubuntu-latest
    steps:
      - name: Send Webhook to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          PAYLOAD='{"content": "🔔 **Pembaruan Project / Task Matcha and Me:** Ada pergerakan atau pembaruan pada status tugas di papan proyek!"}'
          curl -H "Content-Type: application/json" -X POST -d "$PAYLOAD" "$DISCORD_WEBHOOK_URL"
